services:
  mlflow:
    build:
      context: .
      dockerfile: 03_deployment/Dockerfile
    image: fair-price-prediction-service:v1
    command:
      - /app/.venv/bin/mlflow
      - server
      - --host=0.0.0.0
      - --port=5001
      - --backend-store-uri=sqlite:////mlflow/db/mlflow.db
      - --default-artifact-root=/mlflow
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "5001:5001"

  api:
    build:
      context: .
      dockerfile: 03_deployment/Dockerfile
    image: fair-price-prediction-service:v1
    depends_on:
      - mlflow
    env_file:
      - 03_deployment/config/deployment.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "9696:9696"
